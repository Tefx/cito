name: Release Cito.app & Distribution Bundle

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build, Sign, Notarize & Package Cito.app (macOS arm64)
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build & verify native Rust workspace and Homebrew formula
        run: |
          cargo test --workspace
          cargo build --release
          /usr/bin/ruby -c packaging/homebrew/cito.rb

      - name: Build relocatable Cito.app bundle
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          ./bin/cito setup --build-app ./build

      - name: Conditional Developer ID Hardened Runtime Signing & Notarization
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          if [ -n "$APPLE_SIGNING_IDENTITY" ]; then
            codesign --force --options runtime --timestamp --deep --sign "$APPLE_SIGNING_IDENTITY" ./build/Cito.app
            ditto -c -k --keepParent ./build/Cito.app ./build/Cito-notarize.zip
            xcrun notarytool submit ./build/Cito-notarize.zip \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --wait
            xcrun stapler staple ./build/Cito.app
            rm -f ./build/Cito-notarize.zip
          else
            codesign -s - --force --deep ./build/Cito.app
          fi
          ditto -c -k --keepParent ./build/Cito.app Cito-macos-arm64.zip
          shasum -a 256 Cito-macos-arm64.zip > Cito-macos-arm64.zip.sha256

      - name: Upload Release Artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Cito-macos-arm64.zip
            Cito-macos-arm64.zip.sha256
