[package]
name = "cito-native"
version = "0.21.1"
edition = "2021"
publish = false

[dependencies]
libc = "0.2"
serde_json = "1.0"
base64 = "0.22"
getrandom = "0.2"
sha2 = "0.10"
url = "2"
toml_edit = "0.22"
jsonwebtoken = "9.3"
ureq = { version = "2.12", features = ["json"] }

[dev-dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
