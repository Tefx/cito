    <path d="M33 143 L266 141 Q271 177 267 212 L32 213 Z M36 146 L264 144 L264 209" stroke="#38BDF8"/>
    <path d="M32 230 L267 231 L269 300 L34 302 Z M35 233 L264 234 L265 298" stroke="#FB923C"/>
