<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="title desc">
  <title id="title">Agent and Human Nodes connected through one Cito Hub</title>
  <desc id="desc">Pi Coding Agent, Codex, and Claude Code use cito-mcp and a local daemon on port 4290 to reach the embedded or shared Cito Hub on port 4291. The HubEngine uses SQLite WAL, a Node registry with one to many Channels, durable signals, and atomic wake claims. A Human Node named alice attaches a MacBook menu bar and Activity inbox, a Mac Studio menu bar, and a Hub-hosted Telegram channel with an administrator bot service and personal pairing. signal_ack and on_acked synchronize read state through the Hub.</desc>
  <defs>
    <style>
      text { font-family: ui-rounded, 'Trebuchet MS', Arial, sans-serif; fill: #23334b; text-anchor: middle; font-size: 13px; }
      .heading { font-size: 15px; font-weight: 700; }
      .small { font-size: 12px; }
      .label { font-weight: 700; }
      .paper { fill: #fffdf8; stroke: #596980; stroke-width: 1.6; stroke-linejoin: round; }
      .card { fill: #ffffff; stroke: #9caac0; stroke-width: 1.3; }
      .hub { fill: #eff5ff; stroke: #245dcc; stroke-width: 1.8; }
      .flow { fill: none; stroke: #245dcc; stroke-width: 2; stroke-linecap: round;  }
    </style>
  </defs>
  <rect width="960" height="420" rx="14" fill="#f7f8fc"/>
  <!-- Slightly irregular paper outlines preserve the editable hand-drawn style. -->
  <path class="paper" d="M20 14 Q12 14 12 23 L14 348 Q13 359 23 359 L240 358 Q250 358 250 348 L248 23 Q248 13 238 14 Z"/>
  <path class="hub" d="M286 14 Q276 14 276 24 L278 349 Q277 360 287 360 L570 359 Q580 358 580 348 L578 24 Q578 13 568 14 Z"/>
  <path class="paper" d="M616 14 Q606 15 606 25 L608 348 Q607 359 617 359 L936 358 Q946 357 946 347 L944 25 Q944 14 934 14 Z"/>

  <text class="heading" x="131" y="37">Agent Session Nodes</text>
  <text class="small" x="131" y="55">Mac / Workstation</text>
  <rect class="card" x="28" y="77" width="205" height="32" rx="7" transform="rotate(-0.4 130 93)"/>
  <text class="label" x="131" y="98">Pi Coding Agent</text>
  <rect class="card" x="28" y="117" width="205" height="32" rx="7" transform="rotate(0.3 130 133)"/>
  <text class="label" x="131" y="138">Codex</text>
  <rect class="card" x="28" y="157" width="205" height="32" rx="7" transform="rotate(-0.3 130 173)"/>
  <text class="label" x="131" y="178">Claude Code</text>
  <path class="flow" d="M28 93 L21 93 L21 202 L131 202 L131 208 M28 133 L21 133 M28 173 L21 173"/>
  <path class="flow" d="M127 203 L131 208 L135 203"/>
  <rect class="card" x="42" y="213" width="177" height="32" rx="7"/>
  <text class="label" x="131" y="234">cito-mcp</text>
  <path class="flow" d="M131 247 Q132 252 131 260 M127 255 L131 260 L135 255"/>
  <rect class="hub" x="28" y="266" width="205" height="45" rx="8"/>
  <text class="label" x="131" y="293">cito daemon (:4290)</text>
  <text class="small" x="131" y="336">Scope: self | workspace</text>

  <text class="heading" x="428" y="37">Cito Hub</text>
  <text class="small" x="428" y="55">Embedded local or Shared :4291</text>
  <rect class="card" x="292" y="77" width="271" height="55" rx="8" transform="rotate(0.2 428 105)"/>
  <text class="heading" x="428" y="100">HubEngine</text>
  <text x="428" y="120">(SQLite WAL)</text>
  <rect class="card" x="292" y="149" width="271" height="56" rx="8"/>
  <text class="label" x="428" y="172">Node Registry &amp; Leases</text>
  <text class="small" x="428" y="191">Node 1 ↔ Channels 1..K</text>
  <rect class="card" x="292" y="222" width="271" height="56" rx="8" transform="rotate(-0.2 428 250)"/>
  <text class="label" x="428" y="245">Durable Signals &amp;</text>
  <text class="label" x="428" y="264">Atomic Wake Claims</text>
  <text class="small" x="428" y="311">Auth: Trusted | Token | OIDC (PKCE)</text>
  <text class="small" x="428" y="334">HTTP / SSE</text>

  <text class="heading" x="776" y="37">Human Node (@alice)</text>
  <text class="small" x="776" y="55">Attached Channels (1..K)</text>
  <rect class="card" x="623" y="77" width="305" height="62" rx="8" transform="rotate(-0.2 776 108)"/>
  <text class="label" x="776" y="102">1 · MacBook Menu Bar</text>
  <text x="776" y="123">&amp; Activity Inbox</text>
  <rect class="card" x="623" y="157" width="305" height="52" rx="8"/>
  <text class="label" x="776" y="188">2 · Mac Studio Menu Bar</text>
  <rect class="hub" x="623" y="227" width="305" height="75" rx="8" transform="rotate(0.2 776 264)"/>
  <text class="label" x="776" y="251">3 · Hub-Hosted Telegram Channel</text>
  <text class="small" x="776" y="274">Admin Bot Service + User Pairing</text>
  <text class="small" x="776" y="292">Replies travel through the Hub</text>
  <text x="776" y="334">One inbox across attached channels</text>

  <!-- Text-free gutters keep arrows separate from card labels. -->
  <path class="flow" d="M252 289 Q263 287 274 289 M257 285 L252 289 L257 293 M269 285 L274 289 L269 293"/>
  <path class="flow" d="M582 264 Q594 262 604 264 M587 260 L582 264 L587 268 M599 260 L604 264 L599 268"/>
  <path class="flow" stroke-dasharray="5 4" d="M428 361 L428 378 Q600 382 776 378 L776 361"/>
  <path class="flow" d="M424 366 L428 361 L432 366 M772 366 L776 361 L780 366"/>
  <text class="small" x="222" y="404">Signals and replies use the same Hub path</text>
  <text class="label" x="680" y="404">Unified read-sync: signal_ack / on_acked</text>
</svg>
