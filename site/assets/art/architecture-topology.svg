<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="960" height="420" role="img" aria-labelledby="title desc">
  <title id="title">Cito: symmetric nodes, shared Hub, attached channels</title>
  <desc id="desc">Pi, Codex, and Claude Code agent sessions use cito-mcp and wake drivers. A native daemon on port 4290 routes signals through HubEngine with SQLite WAL, leases, split read state, and bounded retry. A Human Node receives on Mac menu bars and Telegram. Remote team Hubs connect over Tailscale, LAN, or OIDC HTTP and SSE on port 4291.</desc>
  <defs>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="8" cy="8" r="0.6" fill="#303744"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 1 1 L 8 5 L 1 9" fill="none" stroke="#F3F4F6" stroke-width="1.5"/></marker>
  </defs>
  <rect width="960" height="420" rx="16" fill="#0C0E12"/>
  <rect x="8" y="8" width="944" height="404" rx="12" fill="url(#dots)"/>
