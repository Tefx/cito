      \ the zero-dependency macOS native HUD banner at `src/macos/cito-banner.swift`\
      \ compiled via `/usr/bin/swiftc` to `${CITO_STATE_DIR}/bin/cito-banner` and\
      \ the Node.js sender/compiler client in `src/banner/` (`docs/DESIGN.md` §6.2.2,\
      \ §7.1, §7.2, §10.4):\n    - Process-lifetime instance lock: upon launch, `cito-banner`\
      \ acquires an exclusive `flock` on `${CITO_STATE_DIR}/sockets/banner-instance.lock`\
      \ (waiting up to `2000ms`) and holds the file descriptor open until `exit(0)`.\n\
      \    - Non-activating `NSPanel` HUD rendering the sender/target metadata and\
      \ message (prefixing subtitle with `[仅知会]` when `effective_wake == false`),\
      \ listening on `${CITO_STATE_DIR}/sockets/banner.sock` (`0600`) to coalesce\
      \ and update content in place while resetting the 6-second auto-dismiss timer,\
      \ and replying `{\"ok\":true}\\n`.\n    - Unified retirement protocol for both\
      \ 6-second timer expiry and user click dismissal:\n      1. Attempt non-blocking\
      \ `flock(LOCK_EX | LOCK_NB)` on `banner.lock` for timer expiry (aborting retirement\
      \ if `EWOULDBLOCK` to process the incoming sender update) or wait up to `500ms`\
      \ to acquire `banner.lock` on click dismissal.\n      2. While holding both\
      \ `banner.lock` and `banner-instance.lock`: unlink `banner.sock`, close the\
      \ listening socket, perform the click action (for Codex: atomically execute\
      \ `UPDATE local_listeners SET human_event_seq = human_event_seq + 1 WHERE harness\
      \ = 'codex' AND session_id = ?` in `${CITO_STATE_DIR}/state.sqlite` via `libsqlite3`\
      \ and open `codex://threads/<thread_id>`; for Pi: dismiss without window switching)\
      \ or `250ms` fade-out, order out the window, and call `exit(0)`.\n    - Sender\
      \ protocol in `src/banner/` (`cito-mcp` caller side): acquires exclusive blocking\
      \ `flock` on `banner.lock` (`2500ms` timeout), attempts `banner.sock` delivery\
      \ (`300ms` connect, `500ms` ack), and on failure probes `banner-instance.lock`\
      \ with non-blocking `flock(LOCK_EX | LOCK_NB)` to execute Case A (busy instance:\
      \ poll `banner.sock` every `50ms` for `500ms`, release `banner.lock` for `300ms`,\
      \ re-acquire `banner.lock`, retry `banner.sock` once, and re-probe `banner-instance.lock`\
      \ non-blocking before entering Case B or skipping without unlinking/spawning)\
