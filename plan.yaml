      \ and update content in place while resetting the 6-second auto-dismiss timer,\
      \ and replying `{\"ok\":true}\\n`.\n    - Unified retirement protocol for both\
      \ 6-second timer expiry and user click dismissal:\n      1. Attempt non-blocking\
      \ `flock(LOCK_EX | LOCK_NB)` on `banner.lock` for timer expiry (aborting retirement\
      \ if `EWOULDBLOCK` to process the incoming sender update) or wait up to `500ms`\
      \ to acquire `banner.lock` on click dismissal.\n      2. While holding both\
      \ `banner.lock` and `banner-instance.lock`: unlink `banner.sock`, close the\
