      \ or `250ms` fade-out, order out the window, and call `exit(0)`.\n    - Sender\
      \ protocol in `src/banner/` (`cito-mcp` caller side): acquires exclusive blocking\
      \ `flock` on `banner.lock` (`2500ms` timeout), attempts `banner.sock` delivery\
      \ (`300ms` connect, `500ms` ack), and on failure probes `banner-instance.lock`\
      \ with non-blocking `flock(LOCK_EX | LOCK_NB)` to execute Case A (busy instance:\
      \ poll `banner.sock` every `50ms` for `500ms`, release `banner.lock` for `300ms`,\
      \ re-acquire `banner.lock`, retry `banner.sock` once, and re-probe `banner-instance.lock`\
      \ non-blocking before entering Case B or skipping without unlinking/spawning)\
      \ or Case B (free instance: unlink stale `banner.sock`, compile if needed and\
      \ spawn `${CITO_STATE_DIR}/bin/cito-banner` detached, poll `banner.sock` every\
      \ `25ms` up to `1000ms`, write payload, await `{\"ok\":true}\\n`, and release\
      \ `banner.lock`).\n  - Deliver automated compilation and lock-synchronized lifecycle\
