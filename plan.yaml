    src/ui/index.ts, src/macos/cito-ui.swift): decouple collectNetworkPeers() into
    a lightweight collectMyRemoteAndOnlineCount() for pushUiState() (avoiding allocating/sorting
    all directory DTOs on every state push) and full-record evaluation in pushUiDirectory()
    / evaluateDirectoryQuery over IndexedRegistration before truncating display fields
    (title <= 200, about <= 300) and enforcing < 128 KiB UTF-8 serialized frame size,
    so a keyword at chars 301-500 of about is found by both cito_find and Search Network
    Directory…; (2) In-Flight HubDirectoryIndex.syncSnapshot Local Mutation Preservation
    (src/mcp/service.ts): track local upsert() and remove() mutations that occur while
    syncSnapshot() is in flight (or re-apply them onto next before committing this.entries
    = next) so an in-flight snapshot never resurrects a locally removed listener or
    overwrites a newer local upsert(), and share a single recordKvEntry helper across
    watchSnapshot and boundedPointGetSnapshot that skips value.state !== "ACTIVE";
    (3) deploy/nats/Dockerfile bin/loader.js Inclusion (deploy/nats/Dockerfile): update
    COPY bin/cito-auth-callout ./bin/cito-auth-callout to COPY bin/cito-auth-callout
    bin/loader.js ./bin/ so the container entrypoint resolves ./loader.js; (4) Claude
    Code /clear Title Reset & Interaction Recency (src/adapters/claude-channel.ts,
    src/adapters/claude.ts): in startClaudeChannelBridge, pass aliasActive ? firstTranscript
    : current (not firstTranscript ?? current) to resolveClaudeSessionTitle so after
    /clear (aliasActive === false), identify resolves the new transcript''s title
    instead of firstTranscript, and advance lastActiveMs on session changes and report
    updated_at_ms: Math.max(lastActiveMs, transcriptMtimeMs) in identify so Claude
    sessions in AVAILABLE SESSIONS sort by interaction recency; (5) DirectoryPanel
    Mouse Selection Sync (src/macos/cito-ui.swift): implement tableViewSelectionDidChange(_
    notification: Notification) on Companion so clicking a row in directoryTableView
    updates directorySelectedIndex and row selection backgrounds, keeping mouse selection
    and Return copy in sync; (6) CLI --claude[=<session_id>] Support without src/mcp/
    Claude References (src/mcp/cli.ts, src/adapters/index.ts, src/adapters/codex.ts,
    src/adapters/git.ts): centralize PID_KEYS / hasExplicitPid in src/adapters/git.ts,
    trim candidate IDs and guard expected_session_id on !hasExplicitPid(meta) in codexThreadId
    (src/adapters/codex.ts), and support --claude[=<session_id>] in cito listen /
    cito unlisten via a generic adapter CLI helper in src/adapters/index.ts so src/mcp/cli.ts
    remains free of direct claude identifiers; (7) Lifecycle Cleanup, UiBridge.close(),
    & Pi /cito Session-Switch Fence (src/mcp/service.ts, src/mcp/receiver.ts, src/ui/index.ts,
    src/pi-extension/cito-bridge.ts, src/adapters/index.ts): clean up receiver maps
    (this.receivers, this.state.liveReceivers, slot.receivers), use slot.connectedBroker(),
    and refresh availableSessions in revokeSession / Receiver.revoke / Receiver.fence
    / HubSlot.disconnect, remove the duplicate if (forceLogin && this.login) block
    in HubSlot.reconnect, share filterAvailableSessions between discoverAllAvailableSessions
    and pushUiState, settle UiBridge.close() when the child emits error or close as
    well as exit, and capture sessionId before awaiting callMcpTool in src/pi-extension/cito-bridge.ts
    /cito handler and skip mutating activeBadge if sessionId changed while awaiting;
    and (8) Symmetric-Difference (O_i \ O_j) Test Witnesses & Version 0.11.2 (tests/ui/lifecycle.test.ts,
    tests/mcp/ui.test.ts, tests/shared/shared.test.ts, package.json, package-lock.json,
    src/shared/index.ts, README.md): add a multi-hub same-session ((harness, session_id)
    on both default and work) test case in tests/ui/lifecycle.test.ts proving uniqueSessionCount
    === 1 while listeners.count === 2 (O_listeners \ O_uniqueSessions != empty), add
