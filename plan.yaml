      \ CLI execution across default and `--codex` modes.\n- **Boundary:** Owner `senior-engineer`;\
      \ modifies `/Users/tefx/Projects/cito` (`src/pi-extension/cito-bridge.ts`, `src/adapters/codex.ts`,\
      \ `src/adapters/index.ts`, `src/mcp/cli.ts`, `README.md`, `tests/adapters/**`,\
      \ `tests/mcp/**`). Must preserve 100% standalone `src/pi-extension/cito-bridge.ts`,\
      \ English-only UI/UX/code/docs, neutral example names, and harness-agnostic\
