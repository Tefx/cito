      \ `flock` on `banner.lock` (`2500ms` timeout), attempts `banner.sock` delivery\
      \ (`300ms` connect, `500ms` ack), and on failure probes `banner-instance.lock`\
      \ with non-blocking `flock(LOCK_EX | LOCK_NB)` to execute Case A (busy instance:\
